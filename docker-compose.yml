services:
  postgres:
    image: postgres:16-alpine
    container_name: luxury_ops_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ferremas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "54320:5432"
    volumes:
      - luxury_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ferremas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxury_ops_backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:admin123@postgres:5432/ferremas_db?schema=public}
      - PORT=${BACKEND_PORT:-4000}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-3000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luxury_ops_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      - PORT=${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  luxury_ops_pgdata:
