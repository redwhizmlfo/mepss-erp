name: Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for testing
        run: |
          cp .env.docker.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Containers
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for Postgres to be healthy
        run: |
          echo "Esperando que PostgreSQL esté listo..."
          for i in {1..10}; do
            if docker compose ps postgres | grep "healthy"; then
              echo "PostgreSQL está listo."
              break
            fi
            echo "Aún no listo, esperando 5 segundos..."
            sleep 5
            if [ $i -eq 10 ]; then
              echo "Timeout esperando a PostgreSQL"
              docker compose logs postgres
              exit 1
            fi
          done

      - name: Wait for Backend to be ready
        run: |
          echo "Esperando que el backend responda..."
          for i in {1..10}; do
            if curl -s -f http://localhost:4000/api/v1/health > /dev/null; then
              echo "Backend está listo."
              break
            fi
            echo "Aún no listo, esperando 5 segundos..."
            sleep 5
            if [ $i -eq 10 ]; then
              echo "Timeout esperando al backend"
              docker compose logs backend
              exit 1
            fi
          done

      - name: Test Frontend HTTP response
        run: |
          if curl -s -I http://localhost:3000 | grep "200 OK"; then
            echo "Frontend responde correctamente"
          else
            echo "Frontend falló al responder"
            docker compose logs frontend
            exit 1
          fi

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        if: github.event_name != 'pull_request'
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}

      - name: Build and push Backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        if: github.event_name != 'pull_request'
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}

      - name: Build and push Frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
